# Runs the collector every 15 minutes on GitHub's servers and commits the new rows.
# Note: GitHub may start scheduled runs a few minutes late or occasionally skip one
# under heavy load. Keep fetched_at_utc and round to 15-min slots during preparation.
name: Collect parking data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:  # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect snapshot
        run: python src/collect_parking_data.py

      - name: Commit new data
        run: |
          git config user.name "parking-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/*.csv
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
