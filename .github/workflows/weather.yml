# Collect weather data daily and synchronize with Neon
name: Collect weather data

on:
  schedule:
    - cron: "13 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect-weather:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install database dependencies
        run: python -m pip install "psycopg[binary]" python-dotenv

      - name: Collect weather and sync to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python src/collect_weather_data.py

      - name: Commit new weather data
        run: |
          git config user.name "weather-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/weather_*.csv
          git diff --cached --quiet || git commit -m "data: weather update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push